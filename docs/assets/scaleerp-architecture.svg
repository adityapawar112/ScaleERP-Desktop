<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%">
  <defs>
    <style>
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .title { font-weight: 800; font-size: 20px; fill: #0f172a; }
      .subtitle { font-weight: 500; font-size: 13px; fill: #475569; }
      .zone-header { font-weight: 800; font-size: 12px; letter-spacing: 0.6px; fill: #ffffff; }
      .block-title { font-weight: 700; font-size: 13.5px; fill: #0f172a; }
      .block-desc { font-weight: 500; font-size: 11.5px; fill: #475569; line-height: 1.4; }
      .channel-text { font-weight: 700; font-size: 10.5px; }
      .mono-tag { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-weight: 600; font-size: 10.5px; }
    </style>

    <filter id="shadow" x="-4%" y="-3%" width="108%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>

    <linearGradient id="blueBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="purpleBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>

    <marker id="arrowRightBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <polygon points="0 1, 7 4, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowLeftPurple" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <polygon points="7 1, 0 4, 7 7" fill="#4f46e5"/>
    </marker>
    <marker id="arrowRightGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <polygon points="0 1, 7 4, 0 7" fill="#059669"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect width="1000" height="560" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Top Title Header -->
  <g transform="translate(36, 28)">
    <rect x="0" y="0" width="138" height="24" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/>
    <circle cx="12" cy="12" r="4.5" fill="#10b981"/>
    <text x="22" y="16" font-size="10.5" font-weight="700" fill="#065f46" letter-spacing="0.4">SYSTEM TOPOLOGY</text>

    <text x="0" y="48" class="title">ScaleERP Dual-Repository Architecture</text>
    <text x="0" y="66" class="subtitle">Air-Gapped Offline Client Workstation (ScaleERP-Desktop) ↔ Cloud Licensing Plane (ScaleERP-Web)</text>

    <!-- Top Right Status Badges -->
    <g transform="translate(670, 6)">
      <rect x="0" y="0" width="134" height="26" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="10" y="17" class="mono-tag" fill="#0f172a">ELECTRON 41 (WAL)</text>
      
      <rect x="142" y="0" width="114" height="26" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="152" y="17" class="mono-tag" fill="#0f172a">NEXT.JS 15 APP</text>
    </g>
  </g>

  <!-- ============================================================== -->
  <!-- ZONE 1: CLIENT WORKSTATION (ScaleERP-Desktop)                   -->
  <!-- ============================================================== -->
  <g transform="translate(36, 115)">
    <!-- Container -->
    <rect width="520" height="405" rx="10" fill="#f8fafc" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
    
    <!-- Header -->
    <rect width="520" height="34" rx="10" fill="url(#blueBar)"/>
    <rect y="24" width="520" height="10" fill="url(#blueBar)"/>
    <text x="16" y="22" class="zone-header">LOCAL WORKSTATION (ScaleERP-Desktop) • 100% OFFLINE AUTONOMY</text>

    <!-- Module 1: Counter Billing Engine -->
    <g transform="translate(18, 50)" filter="url(#shadow)">
      <rect width="234" height="155" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
      <rect width="234" height="28" rx="8" fill="#eff6ff"/>
      <rect y="20" width="234" height="8" fill="#eff6ff"/>
      <text x="12" y="19" class="block-title" fill="#1d4ed8">⚡ Counter Billing (React 19)</text>

      <text x="12" y="48" class="block-desc">• Sub-ms barcode &amp; hotkey input</text>
      <text x="12" y="68" class="block-desc">• Instant cash &amp; UPI split payments</text>
      <text x="12" y="88" class="block-desc">• Automatic customer credit ledgers</text>
      <text x="12" y="108" class="block-desc">• Full English &amp; Marathi localization</text>
      <text x="12" y="132" font-size="10" font-weight="700" fill="#2563eb">ZERO LATENCY ON MODEST HARDWARE</text>
    </g>

    <!-- Module 2: SQLite WAL Storage -->
    <g transform="translate(268, 50)" filter="url(#shadow)">
      <rect width="234" height="155" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
      <rect width="234" height="28" rx="8" fill="#f0fdf4"/>
      <rect y="20" width="234" height="8" fill="#f0fdf4"/>
      <text x="12" y="19" class="block-title" fill="#15803d">🗄️ SQLite 3 WAL Engine</text>

      <text x="12" y="48" class="block-desc">• Direct OS filesystem persistence</text>
      <text x="12" y="68" class="block-desc">• Zero browser quota / storage limits</text>
      <text x="12" y="88" class="block-desc">• ACID atomic commit &amp; stock rollback</text>
      <text x="12" y="108" class="block-desc">• Sub-2ms query on 100k+ records</text>
      <text x="12" y="132" font-size="10" font-weight="700" fill="#15803d">CRASH-RESILIENT ATOMIC FSYNC</text>
    </g>

    <!-- Module 3: Native Hardware Bus -->
    <g transform="translate(18, 222)" filter="url(#shadow)">
      <rect width="234" height="162" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
      <rect width="234" height="28" rx="8" fill="#f0fdfa"/>
      <rect y="20" width="234" height="8" fill="#f0fdfa"/>
      <text x="12" y="19" class="block-title" fill="#0f766e">🖨️ 80mm ESC/POS Printing</text>

      <text x="12" y="48" class="block-desc">• Direct USB/Serial raw byte stream</text>
      <text x="12" y="68" class="block-desc">• Sub-second paper cut (no print prompt)</text>
      <text x="12" y="88" class="block-desc">• A4/A5 dual-stack sheet renderer</text>
      <text x="12" y="108" class="block-desc">• WhatsApp PDF export with 1-click share</text>
      <text x="12" y="134" font-size="10" font-weight="700" fill="#0f766e">FAST COUNTER CHECKOUT</text>
    </g>

    <!-- Module 4: Offline Security & Tamper Guard -->
    <g transform="translate(268, 222)" filter="url(#shadow)">
      <rect width="234" height="162" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
      <rect width="234" height="28" rx="8" fill="#fffbeb"/>
      <rect y="20" width="234" height="8" fill="#fffbeb"/>
      <text x="12" y="19" class="block-title" fill="#b45309">🛡️ Tamper &amp; Drift Shield</text>

      <text x="12" y="48" class="block-desc">• SHA-256 machine hardware binding</text>
      <text x="12" y="68" class="block-desc">• 24h clock-rewind anti-tamper lock</text>
      <text x="12" y="88" class="block-desc">• Offline cryptographic password reset</text>
      <text x="12" y="108" class="block-desc">• Loopback OAuth2 for Google Drive sync</text>
      <text x="12" y="134" font-size="10" font-weight="700" fill="#b45309">AIR-GAPPED HARDWARE LOCK</text>
    </g>
  </g>

  <!-- ============================================================== -->
  <!-- MIDDLE CHANNELS                                                -->
  <!-- ============================================================== -->
  <g transform="translate(568, 170)">
    <!-- Activation Channel -->
    <path d="M 0, 40 L 78, 40" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowRightBlue)"/>
    <rect x="8" y="14" width="64" height="18" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="14" y="27" class="channel-text" fill="#1d4ed8">ACTIVATE</text>

    <!-- License Return Channel -->
    <path d="M 78, 120 L 4, 120" stroke="#4f46e5" stroke-width="2.5" stroke-dasharray="5 3" marker-end="url(#arrowLeftPurple)"/>
    <rect x="8" y="94" width="64" height="18" rx="4" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="13" y="107" class="channel-text" fill="#4338ca">.LIC BLOB</text>

    <!-- Sync Channel -->
    <path d="M 0, 200 L 78, 200" stroke="#059669" stroke-width="2.5" marker-end="url(#arrowRightGreen)"/>
    <rect x="12" y="174" width="56" height="18" rx="4" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="18" y="187" class="channel-text" fill="#15803d">SYNC</text>
  </g>

  <!-- ============================================================== -->
  <!-- ZONE 2: CLOUD CONTROL PLANE (ScaleERP-Web)                     -->
  <!-- ============================================================== -->
  <g transform="translate(660, 115)">
    <!-- Container -->
    <rect width="304" height="405" rx="10" fill="#f8fafc" stroke="#4f46e5" stroke-width="2" filter="url(#shadow)"/>

    <!-- Header -->
    <rect width="304" height="34" rx="10" fill="url(#purpleBar)"/>
    <rect y="24" width="304" height="10" fill="url(#purpleBar)"/>
    <text x="14" y="22" class="zone-header">CLOUD PLANE (ScaleERP-Web)</text>

    <!-- Block 1: Next.js 15 Web Portal -->
    <g transform="translate(16, 50)" filter="url(#shadow)">
      <rect width="272" height="98" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="12" y="24" class="block-title" fill="#0f172a">▲ Next.js 15 Web Portal</text>
      <text x="12" y="48" class="block-desc">• scaleerp.vercel.app public hub</text>
      <text x="12" y="68" class="block-desc">• Markdown documentation engine</text>
      <text x="12" y="88" class="block-desc">• Dynamic SEO &amp; AI directives (llms.txt)</text>
    </g>

    <!-- Block 2: RSA-2048 Signing Authority -->
    <g transform="translate(16, 162)" filter="url(#shadow)">
      <rect width="272" height="108" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="12" y="24" class="block-title" fill="#4338ca">🔑 RSA-2048 Signing Authority</text>
      <text x="12" y="48" class="block-desc">• Private key isolated in secure env</text>
      <text x="12" y="68" class="block-desc">• Signs canonical machine-bound payloads</text>
      <text x="12" y="88" class="block-desc">• RSA-PSS with SHA-256 signature seal</text>
    </g>

    <!-- Block 3: Supabase PostgreSQL -->
    <g transform="translate(16, 284)" filter="url(#shadow)">
      <rect width="272" height="108" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="12" y="24" class="block-title" fill="#15803d">🟢 Supabase PostgreSQL</text>
      <text x="12" y="48" class="block-desc">• Tenant records &amp; license quotas</text>
      <text x="12" y="68" class="block-desc">• Strict 1-device hardware activation map</text>
      <text x="12" y="88" class="block-desc">• Hourly chronometric drift telemetry</text>
    </g>
  </g>
</svg>
