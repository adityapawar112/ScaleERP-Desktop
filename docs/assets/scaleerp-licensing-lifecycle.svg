<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="100%" height="100%">
  <defs>
    <style>
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .title { font-weight: 800; font-size: 20px; fill: #0f172a; }
      .subtitle { font-weight: 500; font-size: 13px; fill: #475569; }
      .step-num { font-weight: 800; font-size: 11px; fill: #ffffff; }
      .card-title { font-weight: 700; font-size: 14px; fill: #0f172a; }
      .card-sub { font-weight: 600; font-size: 11px; }
      .card-desc { font-weight: 500; font-size: 12px; fill: #475569; line-height: 1.4; }
      .mono { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 11px; font-weight: 600; }
    </style>

    <filter id="shadow" x="-4%" y="-3%" width="108%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>

    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <polygon points="0 1, 7 4, 0 7" fill="#4f46e5"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect width="1000" height="440" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Top Title Banner -->
  <g transform="translate(36, 28)">
    <rect x="0" y="0" width="160" height="24" rx="12" fill="#eef2ff" stroke="#c7d2fe"/>
    <circle cx="12" cy="12" r="4.5" fill="#4f46e5"/>
    <text x="22" y="16" font-size="10.5" font-weight="700" fill="#3730a3" letter-spacing="0.4">SECURITY PROTOCOL</text>

    <text x="0" y="48" class="title">Cryptographic Licensing &amp; Anti-Tamper Flow</text>
    <text x="0" y="66" class="subtitle">Asymmetric RSA-2048 machine-bound signing, offline PSS verification, and chronometric drift detection</text>
  </g>

  <!-- ============================================================== -->
  <!-- 4 HORIZONTAL PROTOCOL STAGES                                   -->
  <!-- ============================================================== -->
  <g transform="translate(36, 115)">
    <!-- Stage 1: Hardware Binding -->
    <g transform="translate(0, 0)" filter="url(#shadow)">
      <rect width="216" height="225" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
      <rect width="216" height="34" rx="8" fill="#f0f9ff"/>
      <rect y="24" width="216" height="10" fill="#f0f9ff"/>
      
      <!-- Badge -->
      <circle cx="20" cy="17" r="10" fill="#0284c7"/>
      <text x="17" y="21" class="step-num">1</text>
      <text x="36" y="21" class="card-title" fill="#0369a1">Hardware Binding</text>

      <g transform="translate(14, 48)">
        <text x="0" y="14" class="card-sub" fill="#0284c7">Local Machine Fingerprint</text>
        <rect x="0" y="22" width="188" height="24" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
        <text x="8" y="38" class="mono" fill="#0f172a">SHA-256(CPU+MAC+OS)</text>

        <text x="0" y="70" class="card-desc">• Extracted via native Node modules</text>
        <text x="0" y="90" class="card-desc">• Binds software to physical PC</text>
        <text x="0" y="110" class="card-desc">• Prevents USB snapshot cloning</text>
        <text x="0" y="138" font-size="10.5" font-weight="700" fill="#0284c7">CLIENT RUNTIME</text>
      </g>
    </g>

    <!-- Connector 1 -> 2 -->
    <line x1="222" y1="112" x2="236" y2="112" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- Stage 2: Cloud Entitlement Audit -->
    <g transform="translate(242, 0)" filter="url(#shadow)">
      <rect width="216" height="225" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
      <rect width="216" height="34" rx="8" fill="#f0fdf4"/>
      <rect y="24" width="216" height="10" fill="#f0fdf4"/>

      <circle cx="20" cy="17" r="10" fill="#15803d"/>
      <text x="17" y="21" class="step-num">2</text>
      <text x="36" y="21" class="card-title" fill="#15803d">Quota Audit</text>

      <g transform="translate(14, 48)">
        <text x="0" y="14" class="card-sub" fill="#15803d">Supabase PostgreSQL Gate</text>
        <rect x="0" y="22" width="188" height="24" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
        <text x="8" y="38" class="mono" fill="#0f172a">active &lt; max_devices</text>

        <text x="0" y="70" class="card-desc">• Queries master license_keys</text>
        <text x="0" y="90" class="card-desc">• Verifies revocation &amp; expiry</text>
        <text x="0" y="110" class="card-desc">• Rejects unauthorized machines</text>
        <text x="0" y="138" font-size="10.5" font-weight="700" fill="#15803d">CLOUD GATEWAY</text>
      </g>
    </g>

    <!-- Connector 2 -> 3 -->
    <line x1="464" y1="112" x2="478" y2="112" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- Stage 3: Asymmetric RSA-2048 Minting -->
    <g transform="translate(484, 0)" filter="url(#shadow)">
      <rect width="216" height="225" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
      <rect width="216" height="34" rx="8" fill="#eef2ff"/>
      <rect y="24" width="216" height="10" fill="#eef2ff"/>

      <circle cx="20" cy="17" r="10" fill="#4f46e5"/>
      <text x="17" y="21" class="step-num">3</text>
      <text x="36" y="21" class="card-title" fill="#4338ca">RSA-2048 Minting</text>

      <g transform="translate(14, 48)">
        <text x="0" y="14" class="card-sub" fill="#4338ca">Private Key Signature</text>
        <rect x="0" y="22" width="188" height="24" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
        <text x="8" y="38" class="mono" fill="#0f172a">RSA-PSS (SHA-256)</text>

        <text x="0" y="70" class="card-desc">• Canonicalizes payload JSON</text>
        <text x="0" y="90" class="card-desc">• Cryptographic digital signature</text>
        <text x="0" y="110" class="card-desc">• Packages Base64 .lic envelope</text>
        <text x="0" y="138" font-size="10.5" font-weight="700" fill="#4338ca">SIGNING AUTHORITY</text>
      </g>
    </g>

    <!-- Connector 3 -> 4 -->
    <line x1="706" y1="112" x2="720" y2="112" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- Stage 4: Offline Verification & Drift Guard -->
    <g transform="translate(726, 0)" filter="url(#shadow)">
      <rect width="202" height="225" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
      <rect width="202" height="34" rx="8" fill="#fffbeb"/>
      <rect y="24" width="202" height="10" fill="#fffbeb"/>

      <circle cx="20" cy="17" r="10" fill="#b45309"/>
      <text x="17" y="21" class="step-num">4</text>
      <text x="36" y="21" class="card-title" fill="#b45309">Offline &amp; Drift Guard</text>

      <g transform="translate(14, 48)">
        <text x="0" y="14" class="card-sub" fill="#b45309">Embedded Public Key</text>
        <rect x="0" y="22" width="174" height="24" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
        <text x="8" y="38" class="mono" fill="#0f172a">24h Drift Guard</text>

        <text x="0" y="70" class="card-desc">• Zero network validation</text>
        <text x="0" y="90" class="card-desc">• Detects clock rewinds &gt; 24h</text>
        <text x="0" y="110" class="card-desc">• Challenge-response reset</text>
        <text x="0" y="138" font-size="10.5" font-weight="700" fill="#b45309">AIR-GAPPED SHIELD</text>
      </g>
    </g>
  </g>

  <!-- ============================================================== -->
  <!-- BOTTOM PROTOCOL SUMMARY FOOTER                                 -->
  <!-- ============================================================== -->
  <g transform="translate(36, 365)">
    <rect width="928" height="48" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    
    <text x="16" y="28" font-size="12" font-weight="700" fill="#0f172a">CRYPTOGRAPHIC ASSURANCE:</text>
    <text x="210" y="28" font-size="12" font-weight="500" fill="#475569">Zero network calls required for daily operation &nbsp;•&nbsp; Hardware-bound against software piracy &nbsp;•&nbsp; Tamper-evident clock auditing</text>
  </g>
</svg>
