<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 560" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap');
      
      text {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      .mono {
        font-family: 'JetBrains Mono', monospace;
      }
      .heading {
        font-weight: 800;
        fill: #0f172a;
      }
      .subheading {
        font-weight: 500;
        fill: #64748b;
      }
      .card-title {
        font-weight: 700;
        font-size: 12.5px;
        fill: #ffffff;
      }
      .pill-text {
        font-weight: 600;
        font-size: 11px;
        fill: #1e293b;
      }
      .pill-sub {
        font-weight: 400;
        font-size: 9.5px;
        fill: #64748b;
      }
      .step-badge {
        font-weight: 700;
        font-size: 10px;
        fill: #ffffff;
      }
      .phase-label {
        font-weight: 800;
        font-size: 11px;
        letter-spacing: 0.6px;
      }
    </style>

    <filter id="cardShadow" x="-6%" y="-4%" width="112%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>

    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <linearGradient id="amberGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <linearGradient id="skyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <marker id="arrowRight" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <polygon points="0 1, 7 4, 0 7" fill="#4f46e5"/>
    </marker>
  </defs>

  <!-- Base Canvas -->
  <rect width="1020" height="560" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Top Title Banner -->
  <g transform="translate(36, 28)">
    <rect x="0" y="0" width="180" height="26" rx="13" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
    <circle cx="14" cy="13" r="4.5" fill="#4f46e5"/>
    <text x="26" y="17" font-size="10.5" font-weight="700" fill="#3730a3" letter-spacing="0.5">RSA-2048 CRYPTOGRAPHY</text>

    <text x="0" y="52" class="heading" font-size="19">Licensing Lifecycle &amp; Anti-Tamper Security Architecture</text>
    <text x="0" y="70" class="subheading" font-size="12">Asymmetric signature minting, machine hardware fingerprint binding, and chronometric drift verification</text>
  </g>

  <!-- ============================================================== -->
  <!-- PHASE 1: HARDWARE-BOUND MACHINE ACTIVATION                     -->
  <!-- ============================================================== -->
  <g transform="translate(36, 110)">
    <!-- Phase Container -->
    <rect width="948" height="200" rx="10" fill="#fafafa" stroke="#4f46e5" stroke-width="1.5" stroke-dasharray="5 3"/>
    
    <!-- Phase Tag -->
    <g transform="translate(18, -12)">
      <rect width="320" height="24" rx="5" fill="#4f46e5"/>
      <text x="12" y="16" class="phase-label" fill="#ffffff">PHASE 1: MACHINE-BOUND ACTIVATION FLOW</text>
    </g>

    <!-- STEP 1: Desktop HWID Request -->
    <g transform="translate(18, 22)" filter="url(#cardShadow)">
      <rect width="210" height="160" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
      <rect width="210" height="34" rx="8" fill="url(#skyGrad)"/>
      <rect y="24" width="210" height="10" fill="url(#skyGrad)"/>
      <text x="10" y="22" class="card-title">1. Client Request</text>

      <g transform="translate(10, 44)">
        <text x="0" y="14" class="pill-text">Compute SHA-256 HWID</text>
        <text x="0" y="28" class="mono" font-size="8.5" fill="#64748b">CPU + MAC + OS Hash</text>
        <text x="0" y="44" class="pill-text">POST /activate</text>
        <text x="0" y="58" class="mono" font-size="8.5" fill="#0284c7">{ key, fingerprint, host }</text>
      </g>
    </g>

    <line x1="234" y1="102" x2="252" y2="102" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrowRight)"/>

    <!-- STEP 2: Entitlement & Quota Audit -->
    <g transform="translate(254, 22)" filter="url(#cardShadow)">
      <rect width="210" height="160" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
      <rect width="210" height="34" rx="8" fill="url(#emeraldGrad)"/>
      <rect y="24" width="210" height="10" fill="url(#emeraldGrad)"/>
      <text x="10" y="22" class="card-title">2. Supabase Audit</text>

      <g transform="translate(10, 44)">
        <text x="0" y="14" class="pill-text">Query license_keys</text>
        <text x="0" y="28" class="pill-sub">Verify expiry &amp; revocation</text>
        <text x="0" y="44" class="pill-text">Device Quota Guard</text>
        <text x="0" y="58" class="pill-sub">active_devices &lt; max_devices</text>
        <text x="0" y="74" class="pill-sub" fill="#059669">Strict 1-device machine lock</text>
      </g>
    </g>

    <line x1="470" y1="102" x2="488" y2="102" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrowRight)"/>

    <!-- STEP 3: RSA-2048 Signing Authority -->
    <g transform="translate(490, 22)" filter="url(#cardShadow)">
      <rect width="210" height="160" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
      <rect width="210" height="34" rx="8" fill="url(#purpleGrad)"/>
      <rect y="24" width="210" height="10" fill="url(#purpleGrad)"/>
      <text x="10" y="22" class="card-title">3. RSA-2048 Signer</text>

      <g transform="translate(10, 44)">
        <text x="0" y="14" class="pill-text">Canonicalize JSON</text>
        <text x="0" y="28" class="pill-sub">Alphabetical key sorting</text>
        <text x="0" y="44" class="pill-text">RSA-PSS SHA-256</text>
        <text x="0" y="58" class="pill-sub">Private key asymmetric seal</text>
        <text x="0" y="74" class="pill-sub" fill="#4f46e5">Mints Base64 .lic Envelope</text>
      </g>
    </g>

    <line x1="706" y1="102" x2="724" y2="102" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrowRight)"/>

    <!-- STEP 4: Offline Installation -->
    <g transform="translate(726, 22)" filter="url(#cardShadow)">
      <rect width="204" height="160" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
      <rect width="204" height="34" rx="8" fill="url(#amberGrad)"/>
      <rect y="24" width="204" height="10" fill="url(#amberGrad)"/>
      <text x="10" y="22" class="card-title">4. Offline Persistence</text>

      <g transform="translate(10, 44)">
        <text x="0" y="14" class="pill-text">Store in SQLite WAL</text>
        <text x="0" y="28" class="pill-sub">Atomic write to licenses table</text>
        <text x="0" y="44" class="pill-text">Public Key Verification</text>
        <text x="0" y="58" class="pill-sub">Embedded key_001.pub check</text>
        <text x="0" y="74" class="pill-sub" fill="#d97706">100% Offline Valid State</text>
      </g>
    </g>
  </g>

  <!-- ============================================================== -->
  <!-- PHASE 2: PERIODIC ANTI-TAMPER HEARTBEAT & CHRONOMETRIC AUDIT   -->
  <!-- ============================================================== -->
  <g transform="translate(36, 335)">
    <!-- Phase Container -->
    <rect width="948" height="195" rx="10" fill="#fafafa" stroke="#059669" stroke-width="1.5" stroke-dasharray="5 3"/>

    <!-- Phase Tag -->
    <g transform="translate(18, -12)">
      <rect width="360" height="24" rx="5" fill="#059669"/>
      <text x="12" y="16" class="phase-label" fill="#ffffff">PHASE 2: PERIODIC ANTI-TAMPER HEARTBEAT &amp; AUDIT</text>
    </g>

    <!-- BOX 1: Scheduled Heartbeat -->
    <g transform="translate(18, 22)" filter="url(#cardShadow)">
      <rect width="280" height="155" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
      <rect width="280" height="32" rx="8" fill="url(#emeraldGrad)"/>
      <rect y="22" width="280" height="10" fill="url(#emeraldGrad)"/>
      <text x="12" y="21" class="card-title">Hourly Heartbeat Dispatch</text>

      <g transform="translate(12, 42)">
        <text x="0" y="14" class="pill-text">POST /sync-heartbeat</text>
        <text x="0" y="28" class="mono" font-size="8.5" fill="#64748b">clientSystemTime + dbState</text>
        <text x="0" y="44" class="pill-text">Background Daemon</text>
        <text x="0" y="58" class="pill-sub">Non-blocking background sync routine</text>
        <text x="0" y="72" class="pill-sub" fill="#059669">Captures unmanipulated clock snapshots</text>
      </g>
    </g>

    <!-- BOX 2: Anti-Clock Rewind Guard -->
    <g transform="translate(318, 22)" filter="url(#cardShadow)">
      <rect width="300" height="155" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
      <rect width="300" height="32" rx="8" fill="url(#amberGrad)"/>
      <rect y="22" width="300" height="10" fill="url(#amberGrad)"/>
      <text x="12" y="21" class="card-title">24h Anti-Clock Rewind Guard</text>

      <g transform="translate(12, 42)">
        <text x="0" y="14" class="pill-text">Chronometric Drift Evaluation</text>
        <text x="0" y="28" class="mono" font-size="8.5" fill="#b45309">serverTime - clientTime &gt; 86400000ms</text>
        <text x="0" y="44" class="pill-text">Security Lockout Response</text>
        <text x="0" y="58" class="pill-sub">Logs CLOCK_REWIND_DETECTED to audit</text>
        <text x="0" y="72" class="pill-sub" fill="#b91c1c">Locks client into Grace / Locked state</text>
      </g>
    </g>

    <!-- BOX 3: Database Manipulation Audit -->
    <g transform="translate(638, 22)" filter="url(#cardShadow)">
      <rect width="292" height="155" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
      <rect width="292" height="32" rx="8" fill="url(#purpleGrad)"/>
      <rect y="22" width="292" height="10" fill="url(#purpleGrad)"/>
      <text x="12" y="21" class="card-title">Database Integrity &amp; Renewal</text>

      <g transform="translate(12, 42)">
        <text x="0" y="14" class="pill-text">Tamper Audit Gate</text>
        <text x="0" y="28" class="pill-sub">Alerts if local valid_until &gt; cloud record</text>
        <text x="0" y="44" class="pill-text">Seamless Auto-Renewal</text>
        <text x="0" y="58" class="pill-sub">If cloud record extended, re-signs fresh blob</text>
        <text x="0" y="72" class="pill-sub" fill="#4f46e5">Normal sync: updates last_sync_at</text>
      </g>
    </g>
  </g>
</svg>
