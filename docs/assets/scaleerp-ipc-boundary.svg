<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 540" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap');
      
      text {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      .mono {
        font-family: 'JetBrains Mono', monospace;
      }
      .heading {
        font-weight: 800;
        fill: #0f172a;
      }
      .subheading {
        font-weight: 500;
        fill: #64748b;
      }
      .card-title {
        font-weight: 700;
        font-size: 13px;
        fill: #ffffff;
      }
      .pill-text {
        font-weight: 600;
        font-size: 11px;
        fill: #1e293b;
      }
      .pill-sub {
        font-weight: 400;
        font-size: 9.5px;
        fill: #64748b;
      }
      .step-badge {
        font-weight: 700;
        font-size: 10px;
        fill: #ffffff;
      }
    </style>

    <!-- Filters -->
    <filter id="cardShadow" x="-6%" y="-4%" width="112%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="rendererGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <linearGradient id="bridgeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <linearGradient id="mainGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="engineGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Markers -->
    <marker id="arrowRightBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <polygon points="0 1, 7 4, 0 7" fill="#0284c7"/>
    </marker>
    <marker id="arrowRightGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <polygon points="0 1, 7 4, 0 7" fill="#059669"/>
    </marker>
    <marker id="arrowRightSlate" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <polygon points="0 1, 7 4, 0 7" fill="#0f172a"/>
    </marker>
    <marker id="arrowLeftBlue" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <polygon points="7 1, 0 4, 7 7" fill="#0284c7"/>
    </marker>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1020" height="540" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Top Title Banner -->
  <g transform="translate(36, 28)">
    <rect x="0" y="0" width="168" height="26" rx="13" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <circle cx="14" cy="13" r="4.5" fill="#16a34a"/>
    <text x="26" y="17" font-size="10.5" font-weight="700" fill="#15803d" letter-spacing="0.5">PROCESS ISOLATION</text>

    <text x="0" y="52" class="heading" font-size="19">Electron 41 Multi-Process Security Boundary</text>
    <text x="0" y="70" class="subheading" font-size="12">Preload ContextBridge isolation protecting native filesystem, SQLite WAL transactions, and raw thermal hardware</text>

    <!-- Security Badges Right -->
    <g transform="translate(680, 4)">
      <rect x="0" y="0" width="136" height="24" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="10" y="16" font-size="9.5" font-weight="700" fill="#1d4ed8">contextIsolation: true</text>
      
      <rect x="144" y="0" width="138" height="24" rx="6" fill="#fef2f2" stroke="#fecaca"/>
      <text x="154" y="16" font-size="9.5" font-weight="700" fill="#b91c1c">nodeIntegration: false</text>
    </g>
  </g>

  <!-- ============================================================== -->
  <!-- 4 PROCESS TIERS                                                -->
  <!-- ============================================================== -->

  <!-- TIER 1: Chromium Renderer Process (React 19) -->
  <g transform="translate(36, 115)" filter="url(#cardShadow)">
    <rect width="216" height="340" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect width="216" height="42" rx="10" fill="url(#rendererGrad)"/>
    <rect y="32" width="216" height="10" fill="url(#rendererGrad)"/>
    <text x="14" y="26" class="card-title">1. Chromium Renderer</text>

    <!-- Subtitle pill -->
    <g transform="translate(12, 52)">
      <rect width="192" height="66" rx="6" fill="#f0f9ff" stroke="#bae6fd"/>
      <text x="10" y="18" font-size="10" font-weight="700" fill="#0369a1">React 19 Frontend</text>
      <text x="10" y="32" class="mono" font-size="8.5" fill="#0c4a6e">window.electronAPI.invoke()</text>
      <text x="10" y="46" font-size="8.5" fill="#0369a1">• Zero direct Node.js API access</text>
      <text x="10" y="58" font-size="8.5" fill="#0369a1">• Strict DOM sandboxing</text>
    </g>

    <!-- Feature Pills -->
    <g transform="translate(12, 128)">
      <rect width="192" height="46" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="10" y="18" class="pill-text">Bilingual Counter POS</text>
      <text x="10" y="32" class="pill-sub">English &amp; Marathi UI localization</text>
    </g>

    <g transform="translate(12, 180)">
      <rect width="192" height="46" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="10" y="18" class="pill-text">Reactive State Store</text>
      <text x="10" y="32" class="pill-sub">Real-time ledger Context API</text>
    </g>

    <g transform="translate(12, 232)">
      <rect width="192" height="46" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="10" y="18" class="pill-text">Barcode &amp; Hotkeys</text>
      <text x="10" y="32" class="pill-sub">Sub-millisecond keyboard entry</text>
    </g>

    <g transform="translate(12, 284)">
      <rect width="192" height="44" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="10" y="18" class="pill-text" fill="#0f172a">Untrusted Boundary</text>
      <text x="10" y="32" class="pill-sub">Cannot touch filesystem/OS</text>
    </g>
  </g>

  <!-- TIER 2: Preload ContextBridge (Security Gateway) -->
  <g transform="translate(280, 115)" filter="url(#cardShadow)">
    <rect width="216" height="340" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect width="216" height="42" rx="10" fill="url(#bridgeGrad)"/>
    <rect y="32" width="216" height="10" fill="url(#bridgeGrad)"/>
    <text x="14" y="26" class="card-title">2. Preload ContextBridge</text>

    <!-- Subtitle pill -->
    <g transform="translate(12, 52)">
      <rect width="192" height="66" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
      <text x="10" y="18" font-size="10" font-weight="700" fill="#15803d">Security Intermediary</text>
      <text x="10" y="32" class="mono" font-size="8.5" fill="#166534">contextBridge.expose()</text>
      <text x="10" y="46" font-size="8.5" fill="#15803d">• Deep argument cloning</text>
      <text x="10" y="58" font-size="8.5" fill="#15803d">• Prototype pollution defense</text>
    </g>

    <!-- Feature Pills -->
    <g transform="translate(12, 128)">
      <rect width="192" height="46" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="10" y="18" class="pill-text">Channel Whitelisting</text>
      <text x="10" y="32" class="pill-sub">Restricted to approved IPC routes</text>
    </g>

    <g transform="translate(12, 180)">
      <rect width="192" height="46" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="10" y="18" class="pill-text">Input Sanitization</text>
      <text x="10" y="32" class="pill-sub">Schema &amp; payload type validation</text>
    </g>

    <g transform="translate(12, 232)">
      <rect width="192" height="46" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="10" y="18" class="pill-text">Safe IPC Dispatch</text>
      <text x="10" y="32" class="pill-sub">Translates to ipcRenderer.invoke</text>
    </g>

    <g transform="translate(12, 284)">
      <rect width="192" height="44" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="10" y="18" class="pill-text" fill="#0f172a">Bidirectional Barrier</text>
      <text x="10" y="32" class="pill-sub">Guards memory from renderer</text>
    </g>
  </g>

  <!-- TIER 3: Node.js Main Process Runtime -->
  <g transform="translate(524, 115)" filter="url(#cardShadow)">
    <rect width="216" height="340" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect width="216" height="42" rx="10" fill="url(#mainGrad)"/>
    <rect y="32" width="216" height="10" fill="url(#mainGrad)"/>
    <text x="14" y="26" class="card-title">3. Node.js Main Process</text>

    <!-- Subtitle pill -->
    <g transform="translate(12, 52)">
      <rect width="192" height="66" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="10" y="18" font-size="10" font-weight="700" fill="#0f172a">Node.js 20 Execution Core</text>
      <text x="10" y="32" class="mono" font-size="8.5" fill="#334155">ipcMain.handle(channel)</text>
      <text x="10" y="46" font-size="8.5" fill="#334155">• Session authentication checks</text>
      <text x="10" y="58" font-size="8.5" fill="#334155">• License grace mode enforcement</text>
    </g>

    <!-- Feature Pills -->
    <g transform="translate(12, 128)">
      <rect width="192" height="46" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="10" y="18" class="pill-text">Security Service</text>
      <text x="10" y="32" class="pill-sub">RSA-2048 verification &amp; HWID</text>
    </g>

    <g transform="translate(12, 180)">
      <rect width="192" height="46" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="10" y="18" class="pill-text">Database Coordinator</text>
      <text x="10" y="32" class="pill-sub">ACID transactions &amp; rollbacks</text>
    </g>

    <g transform="translate(12, 232)">
      <rect width="192" height="46" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="10" y="18" class="pill-text">Google Drive Daemon</text>
      <text x="10" y="32" class="pill-sub">Loopback OAuth2 on port 42856</text>
    </g>

    <g transform="translate(12, 284)">
      <rect width="192" height="44" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="10" y="18" class="pill-text" fill="#0f172a">Hardware Supervisor</text>
      <text x="10" y="32" class="pill-sub">Direct USB/Serial port binding</text>
    </g>
  </g>

  <!-- TIER 4: SQLite 3 Engine & Native Drivers -->
  <g transform="translate(768, 115)" filter="url(#cardShadow)">
    <rect width="216" height="340" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect width="216" height="42" rx="10" fill="url(#engineGrad)"/>
    <rect y="32" width="216" height="10" fill="url(#engineGrad)"/>
    <text x="14" y="26" class="card-title">4. Engines &amp; Hardware</text>

    <!-- Subtitle pill -->
    <g transform="translate(12, 52)">
      <rect width="192" height="66" rx="6" fill="#fffbeb" stroke="#fde68a"/>
      <text x="10" y="18" font-size="10" font-weight="700" fill="#b45309">SQLite WAL &amp; ESC/POS</text>
      <text x="10" y="32" class="mono" font-size="8.5" fill="#92400e">Native C++ Addons</text>
      <text x="10" y="46" font-size="8.5" fill="#b45309">• Direct OS filesystem I/O</text>
      <text x="10" y="58" font-size="8.5" fill="#b45309">• High-speed thermal paper cut</text>
    </g>

    <!-- Feature Pills -->
    <g transform="translate(12, 128)">
      <rect width="192" height="46" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="10" y="18" class="pill-text">Embedded SQLite 3</text>
      <text x="10" y="32" class="pill-sub">WAL journal with fsync commits</text>
    </g>

    <g transform="translate(12, 180)">
      <rect width="192" height="46" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="10" y="18" class="pill-text">80mm Thermal Head</text>
      <text x="10" y="32" class="pill-sub">Raw byte stream ESC/POS print</text>
    </g>

    <g transform="translate(12, 232)">
      <rect width="192" height="46" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="10" y="18" class="pill-text">Backup ZIP Packaging</text>
      <text x="10" y="32" class="pill-sub">AES-encrypted snapshot archive</text>
    </g>

    <g transform="translate(12, 284)">
      <rect width="192" height="44" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="10" y="18" class="pill-text" fill="#0f172a">Zero Quota Storage</text>
      <text x="10" y="32" class="pill-sub">100k+ rows in sub-2ms query</text>
    </g>
  </g>

  <!-- ============================================================== -->
  <!-- HORIZONTAL DATA FLOW BUS (Bottom)                              -->
  <!-- ============================================================== -->
  <g transform="translate(36, 470)">
    <rect width="948" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Step 1 -->
    <g transform="translate(20, 16)">
      <rect width="22" height="20" rx="10" fill="#0284c7"/>
      <text x="7" y="14" class="step-badge">1</text>
      <text x="30" y="14" font-size="10.5" font-weight="700" fill="#0f172a">IPC Invoke</text>
      <line x1="95" y1="10" x2="165" y2="10" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arrowRightBlue)"/>
    </g>

    <!-- Step 2 -->
    <g transform="translate(205, 16)">
      <rect width="22" height="20" rx="10" fill="#059669"/>
      <text x="7" y="14" class="step-badge">2</text>
      <text x="30" y="14" font-size="10.5" font-weight="700" fill="#0f172a">Sanitize &amp; Filter</text>
      <line x1="125" y1="10" x2="195" y2="10" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowRightGreen)"/>
    </g>

    <!-- Step 3 -->
    <g transform="translate(425, 16)">
      <rect width="22" height="20" rx="10" fill="#0f172a"/>
      <text x="7" y="14" class="step-badge">3</text>
      <text x="30" y="14" font-size="10.5" font-weight="700" fill="#0f172a">Audit &amp; Dispatch</text>
      <line x1="125" y1="10" x2="195" y2="10" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrowRightSlate)"/>
    </g>

    <!-- Step 4 & 5 -->
    <g transform="translate(645, 16)">
      <rect width="22" height="20" rx="10" fill="#d97706"/>
      <text x="7" y="14" class="step-badge">4</text>
      <text x="30" y="14" font-size="10.5" font-weight="700" fill="#0f172a">Atomic Transaction</text>
      <text x="160" y="14" font-size="10" font-weight="600" fill="#059669">⑤ Resolves Promise</text>
      <line x1="280" y1="10" x2="260" y2="10" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arrowLeftBlue)"/>
    </g>
  </g>
</svg>
